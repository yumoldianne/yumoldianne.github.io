<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>lost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --ink: #1a1a1a;
      --soft: #6b6b6b;
      --glow1: #f4ecf7;
      --glow2: #fbf3e6;
      --glow3: #eef4f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "EB Garamond", Garamond, "Times New Roman", serif;
      font-size: 20px;
      line-height: 1.5;
      display: flex; flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
    a:focus-visible { outline: 1px dashed var(--ink); outline-offset: 4px; }

    .page { max-width: 1200px; margin: 0 auto; padding: 0 48px; width: 100%; }

    header.top .page {
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding-top: 28px; padding-bottom: 28px; font-size: 16px;
    }
    header.top a:last-child { text-align: right; }

    main {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 32px 24px 80px;
    }
    .art { position: relative; width: min(420px, 90vw); margin-bottom: 32px; }
    .art::before {
      content: ""; position: absolute; inset: 5%;
      background:
        radial-gradient(closest-side at 35% 55%, var(--glow1), transparent),
        radial-gradient(closest-side at 65% 45%, var(--glow2), transparent),
        radial-gradient(closest-side at 50% 70%, var(--glow3), transparent);
      filter: blur(20px); z-index: -1;
    }
    .art svg { width: 100%; height: auto; display: block; }

    .code { color: var(--soft); font-size: 17px; margin-bottom: 8px; }
    h1 { font-weight: 400; font-size: clamp(34px, 5vw, 48px); line-height: 1.1; margin-bottom: 14px; }
    p.note { color: var(--soft); max-width: 420px; margin-bottom: 28px; }
    .home { font-size: 20px; }
    .home em { font-style: italic; }

    @media (max-width: 820px) {
      .page { padding: 0 24px; }
      header.top .page { grid-template-columns: repeat(2, 1fr); row-gap: 6px; }
      header.top a:nth-child(even) { text-align: right; }
    }
  </style>
</head>
<body>

  <!-- links start with "/" so they work from any broken URL -->
  <header class="top">
    <div class="page">
      <a href="/about-me.html">your name</a>
      <a href="/#about">about</a>
      <a href="/#experience">experience</a>
      <a href="/#projects">projects</a>
    </div>
  </header>

  <main>
    <!-- a dashed path that wanders off and ends at a signpost -->
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 420 260" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- cloud -->
        <path d="M250 70c-4-16 12-28 26-20 6-20 34-22 42-4 12-8 30 0 28 14 14 2 18 14 10 22"/>
        <path d="M234 84c46-2 96 2 132-4"/>
        <!-- ground -->
        <path d="M20 210c70-16 140-12 200-2s120 10 180-6"/>
        <!-- wandering dashed path that loops and stops -->
        <path d="M40 240c30-20 10-50 50-56s50 30 80 10-10-50 30-60 40 30 26 44" stroke-dasharray="9 11"/>
        <!-- question-mark footprints -->
        <path d="M234 162c0-10 14-12 14-2 0 6-7 7-7 13" stroke-width="2"/>
        <circle cx="241" cy="181" r="1.6" fill="currentColor"/>
        <!-- signpost -->
        <path d="M330 206v-80"/>
        <path d="M330 136h44l10 9-10 9h-44z"/>
        <path d="M330 162h-40l-10 9 10 9h40z"/>
        <!-- grass tufts -->
        <path d="M318 206l4-12 4 12M338 206l4-10 4 10" stroke-width="1.6"/>
        <path d="M120 214l4-10 4 10" stroke-width="1.6"/>
        <!-- bird -->
        <path d="M150 60c7-7 14-7 20 0c6-7 13-7 20 0"/>
      </svg>
    </div>

    <p class="code">404</p>
    <h1>you’ve wandered off the path</h1>
    <p class="note">the page you’re looking is still being worked on.</p>
    <a class="home" href="/">find your way home →</a>
  </main>

</body>
</html>
